[package]
name = "typstninja-wasm"
version = "0.13.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
build = "../../build.rs"

[lib]
name = "typstninja_wasm_v0_13_0"
path = "../../src/lib.rs"
crate-type = ["cdylib"]

[workspace]

[features]
default = ["browser"]
browser = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook", "dep:js-sys"]
raw = ["dep:serde_json"]

[dependencies]
comemo = "=0.4.0"
wasm-bindgen = { version = "=0.2.128", optional = true }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde_bytes = "0.11"
serde_json = { version = "1", optional = true }
js-sys = { version = "=0.3.105", optional = true }
time = { version = "0.3", default-features = false, features = ["std"] }
typst = "=0.13.0"
typst-pdf = "=0.13.0"
typst-svg = "=0.13.0"
typst-render = "=0.13.0"
typst-html = "=0.13.0"
typst-ide = "=0.13.0"
typst-assets = { version = "=0.13.0", features = ["fonts"] }

# Keep Typst internals on the selected engine patch.
typst-syntax = "=0.13.0"
typst-macros = "=0.13.0"
typst-timing = "=0.13.0"
typst-utils = "=0.13.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
