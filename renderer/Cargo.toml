[package]
name = "typst-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"

[features]
default = []
reflexo-renderer = ["dep:reflexo-typst", "dep:reflexo-vec2svg"]

[dependencies]
base64 = "0.22.1"
flate2 = "1.1.2"
reflexo-typst = { version = "=0.8.0-rc3", default-features = false, features = ["no-content-hint"], optional = true }
reflexo-vec2svg = { version = "=0.8.0-rc3", default-features = false, optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tar = "0.4.44"
tempfile = "3.20.0"
tinymist-world = { version = "=0.15.0", features = ["system"] }
typst = "=0.15.0"
typst-assets = { version = "=0.15.0", features = ["fonts"] }
typst-bundle = "=0.15.0"
typst-eval = "=0.15.0"
typst-html = "=0.15.0"
typst-ide = "=0.15.0"
typst-layout = "=0.15.0"
typst-library = "=0.15.0"
typst-macros = "=0.15.0"
typst-pdf = "=0.15.0"
typst-realize = "=0.15.0"
typst-render = "=0.15.0"
typst-svg = "=0.15.0"
typst-syntax = "=0.15.0"
typst-timing = "=0.15.0"
typst-utils = "=0.15.0"
ureq = { version = "3.0.12", default-features = false, features = ["rustls"] }
url = "2.5.4"

[dev-dependencies]
tiny_http = "0.12.0"

[profile.release]
lto = "thin"
strip = true
