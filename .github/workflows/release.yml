# GitHub Actions workflow for producing a signed GitHub release.
# Marketplace publishing remains disabled unless MARKETPLACE_PUBLISH_ENABLED is explicitly set to true.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [ prereleased, released ]

jobs:
  release:
    name: Sign and attach plugin
    if: ${{ !startsWith(github.event.release.tag_name, 'typst-wasm-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: true

      - name: Sign and verify plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          CERTIFICATE_CHAIN_FILE: ${{ runner.temp }}/typstninja-certificate-chain.pem
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          printf '%s' "$CERTIFICATE_CHAIN" > "$CERTIFICATE_CHAIN_FILE"
          chmod 600 "$CERTIFICATE_CHAIN_FILE"
          ./gradlew signPlugin verifyPluginSignature --console=plain

      - name: Publish Plugin
        if: ${{ vars.MARKETPLACE_PUBLISH_ENABLED == 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --console=plain

      # Upload an artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*-signed.zip --clobber
          gh release upload ${{ github.event.release.tag_name }} ./LICENSE --clobber
          gh release upload ${{ github.event.release.tag_name }} ./src/main/resources/META-INF/third-party-notices.txt --clobber
